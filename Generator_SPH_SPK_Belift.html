<style>
:root{
  --orange:#D95103; --burnt:#A63F04; --brown:#592203; --ink:#2B1B10;
  --paper:#fff; --shell:#F0EDE9; --line:#DFD8D1; --muted:#7A6E66;
  --ok:#1E6B3A; --warn:#B8860B; --bad:#9C0006; --sub:#8A7A6E;
  --pageW:210mm; --pageH:297mm;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Barlow,system-ui,sans-serif;background:var(--shell);color:var(--ink);font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

.topbar{position:sticky;top:0;z-index:60;background:var(--brown);color:#fff;display:flex;align-items:center;
  gap:18px;padding:0 16px;height:56px;border-bottom:3px solid var(--orange)}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:.06em}
.brand span{color:var(--orange)}
.tabs{display:flex;gap:2px}
.tab{background:none;border:0;color:#E8DCD3;padding:8px 18px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;
  font-weight:600;font-size:17px;letter-spacing:.08em;border-bottom:3px solid transparent;margin-bottom:-3px}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--orange)}
.topActions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;padding:7px 13px;border-radius:3px;
  cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--orange);border-color:var(--orange)}
.btn.primary:hover{background:#c04802}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.topbar .btn:focus-visible{outline-color:#fff}

.layout{display:grid;grid-template-columns:430px 1fr}
@media(max-width:1180px){.layout{grid-template-columns:1fr}}
.form{background:var(--paper);border-right:1px solid var(--line);height:calc(100vh - 56px);
  overflow-y:auto;position:sticky;top:56px;padding-bottom:60px}
@media(max-width:1180px){.form{height:auto;position:static}}
.grp{border-bottom:1px solid var(--line)}
.grp>summary{cursor:pointer;list-style:none;padding:11px 16px;background:#FAF8F6;font-family:'Barlow Condensed',sans-serif;
  font-weight:600;font-size:15px;letter-spacing:.07em;text-transform:uppercase;color:var(--burnt);
  display:flex;align-items:center;gap:8px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"\25B8";color:var(--orange);font-size:12px}
.grp[open]>summary::before{content:"\25BE"}
.fields{padding:12px 16px 16px;display:grid;gap:11px}
.f{display:grid;gap:4px}
.f label{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:3px;background:#fff}
.f textarea{min-height:54px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:11px;color:var(--muted);line-height:1.45}
.flag{font-size:11.5px;line-height:1.5;padding:8px 10px;border-left:3px solid var(--warn);background:#FDF7E7;
  color:#5C4708;border-radius:0 3px 3px 0}
.computed{font-family:'Barlow Semi Condensed',sans-serif;font-size:13px;background:#F5F1ED;border:1px dashed var(--line);
  border-radius:3px;padding:8px 10px;color:var(--brown);line-height:1.6}
.computed b{font-weight:600}
.computed .big{font-size:16px;font-weight:600;color:var(--orange)}

.ptbl{width:100%;border-collapse:collapse;font-size:12px}
.ptbl th{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;
  text-align:left;padding:4px 3px;border-bottom:1px solid var(--line)}
.ptbl td{padding:3px;border-bottom:1px solid #F0EBE6;vertical-align:middle}
.ptbl tr.kel td{background:#F5F1ED;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--burnt);font-size:11.5px;padding:6px 4px}
.ptbl tr.sub td:nth-child(2){padding-left:16px;color:var(--sub);font-size:11.5px}
.ptbl tr.sub td:nth-child(2)::before{content:"\21B3 ";color:var(--orange)}
.ptbl input[type=number],.ptbl input[type=text]{width:100%;padding:4px 5px;border:1px solid var(--line);
  border-radius:3px;text-align:right;font-size:11.5px}
.ptbl input:disabled{background:#F7F4F1;color:#B5AAA1}
.ptbl input[type=checkbox]{width:15px;height:15px;accent-color:var(--orange)}
.ptbl td.c{text-align:center}
.off td:nth-child(n+2){opacity:.4}

.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font-size:11.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brown);color:#fff;border-color:var(--brown)}
.tblk{border:1px solid var(--line);border-radius:4px;padding:10px}
.tblk h5{margin:0 0 7px;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--burnt)}
.trow{display:grid;grid-template-columns:52px 1fr 92px 26px;gap:6px;align-items:center;margin-bottom:5px}
.trow input,.trow select{padding:5px 6px;border:1px solid var(--line);border-radius:3px;font-size:11.5px;width:100%}
.trow .del{border:0;background:none;color:var(--bad);cursor:pointer;font-size:15px;line-height:1}
.mini{border:1px dashed var(--line);background:#fff;border-radius:3px;padding:4px 9px;font-size:11.5px;
  cursor:pointer;color:var(--burnt)}
.sumline{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px}
.sumline b.bad{color:var(--bad)} .sumline b.ok{color:var(--ok)}

.preview{padding:22px;display:flex;flex-direction:column;align-items:center;gap:18px}
.page{width:var(--pageW);min-height:var(--pageH);background:#fff;box-shadow:0 2px 18px rgba(89,34,3,.16);
  padding:18mm 17mm 16mm;position:relative;overflow:hidden;font-size:10.5pt;line-height:1.5}
.page.cont{padding-top:22mm}
.page::before{content:"";position:absolute;left:0;top:0;width:34mm;height:24mm;background:var(--orange);border-bottom-right-radius:9mm}
.page::after{content:"";position:absolute;left:6mm;top:0;width:26mm;height:20mm;border:.7pt solid #fff;border-top:0;
  border-bottom-right-radius:8mm}
.pgnum{position:absolute;left:17mm;bottom:9mm;font-size:9pt;color:var(--muted)}
.paraf{position:absolute;right:17mm;bottom:9mm;font-size:8pt;color:var(--muted)}
.lethead{display:flex;justify-content:space-between;align-items:flex-start;margin-left:36mm;gap:10mm}
.doctype{font-family:'Barlow Condensed',sans-serif;font-size:34pt;color:var(--burnt);letter-spacing:.02em;line-height:1;margin-top:14mm}
.co{text-align:right;font-size:8.5pt;color:#4A3A2E;line-height:1.45;margin-top:2mm}
.co .mark{font-family:'Barlow Condensed',sans-serif;font-size:26pt;font-weight:700;color:var(--brown)}
.co .mark i{font-style:normal;color:var(--orange)}
.co .ent{font-size:11pt;color:var(--burnt);font-weight:500;margin-bottom:1mm}
.docno{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:19pt;font-weight:600;color:var(--orange);
  letter-spacing:.08em;margin:9mm 0 6mm}
.place{text-align:right;font-size:10pt;margin-bottom:5mm}
.to{margin-bottom:6mm}
.subject{font-weight:700;margin:0 0 4mm 8mm}
.body p{margin:0 0 3.4mm}
.body h4{font-size:10.5pt;margin:5mm 0 1.6mm;font-weight:700}
.ind{margin-left:8mm}
.secttl{font-family:'Barlow Condensed',sans-serif;font-size:17pt;font-weight:500;margin:0 0 4mm}
table.doc{width:100%;border-collapse:collapse;font-size:9pt;margin:3mm 0}
table.doc th,table.doc td{border:.6pt solid #4A3A2E;padding:1.8mm 2.2mm;vertical-align:middle}
table.doc th{font-weight:600;text-align:center}
table.doc td.n{text-align:right;white-space:nowrap}
table.doc td.c{text-align:center}
tr.grp2 td{background:#F5F1ED;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em;
  text-transform:uppercase;font-size:9.5pt}
tr.subrow td:nth-child(2){padding-left:6mm;font-style:italic;color:#5A4A3E}
tr.subrow td:nth-child(2)::before{content:"\21B3 "}
.inc{text-align:center;font-style:italic;color:#5A4A3E}
.spec th.head{background:var(--orange);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:12pt;
  letter-spacing:.05em;text-transform:uppercase}
.spec td:first-child{text-align:center;width:16mm}
.spec td:nth-child(2){width:62mm}
.hl{color:#C0392B}
.total td{font-weight:700;background:#FBE9DF}
.terbilang{font-weight:700;margin-top:3mm}
.ol{margin:0;padding-left:6mm} .ol li{margin-bottom:2.6mm}
.ul{margin:1mm 0 3mm;padding-left:6mm} .ul li{margin-bottom:1.4mm}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm 5mm;margin-top:5mm}
.dcard{text-align:center}
.dcard .box{height:44mm;border:.6pt solid var(--line);border-radius:2mm;display:flex;align-items:center;
  justify-content:center;overflow:hidden;background:#FBF9F7}
.dcard .box img{max-width:100%;max-height:100%;object-fit:contain}
.dcard .box .ph{font-size:8pt;color:#B5AAA1;padding:4mm;line-height:1.4}
.dcard .cap{font-size:8.5pt;margin-top:1.5mm;font-style:italic}
.dcard .cap b{font-style:normal;display:block;font-size:9pt}
.sign{display:flex;justify-content:space-between;margin-top:10mm;text-align:center;font-size:10pt}
.sign>div{width:74mm}
.sigbox{position:relative;height:30mm;margin-top:2mm}
.sigbox img.cap{position:absolute;left:50%;top:50%;transform:translate(-58%,-50%) rotate(-8deg);height:26mm;opacity:.85}
.sigbox img.ttd{position:absolute;left:50%;top:50%;transform:translate(-42%,-50%);height:20mm}
.sig-nm{font-weight:700;border-top:.6pt solid var(--ink);padding-top:1.5mm;display:inline-block;min-width:52mm}
.rt{text-align:right}
.plabel{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;align-self:flex-start;margin-left:calc(50% - var(--pageW)/2)}

@page{size:A4;margin:0}
@media print{
  .topbar,.form,.plabel{display:none!important}
  body{background:#fff}
  .layout{display:block} .preview{padding:0;gap:0;display:block}
  .page{box-shadow:none;margin:0;width:210mm;min-height:297mm;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  <div class="brand">BEL<span>IFT</span></div>

}
var SATUAN=["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
function terbilang(n){
  n=Math.floor(Math.abs(num(n)));
  if(n<12) return SATUAN[n]||"nol";
  if(n<20) return terbilang(n-10)+" belas";
  if(n<100) return terbilang(Math.floor(n/10))+" puluh"+(n%10?" "+terbilang(n%10):"");
  if(n<200) return "seratus"+(n%100?" "+terbilang(n%100):"");
  if(n<1000) return terbilang(Math.floor(n/100))+" ratus"+(n%100?" "+terbilang(n%100):"");
  if(n<2000) return "seribu"+(n%1000?" "+terbilang(n%1000):"");
  if(n<1e6) return terbilang(Math.floor(n/1e3))+" ribu"+(n%1e3?" "+terbilang(n%1e3):"");
  if(n<1e9) return terbilang(Math.floor(n/1e6))+" juta"+(n%1e6?" "+terbilang(n%1e6):"");
  return terbilang(Math.floor(n/1e9))+" miliar"+(n%1e9?" "+terbilang(n%1e9):"");
}
function terbilangRp(n){var t=terbilang(n).trim();return t.charAt(0).toUpperCase()+t.slice(1)+" Rupiah"}
function esc(s){return String(s==null?"":s).replace(/[<>"]/g,function(c){

function setItem(i,k,v){
  ITEMS[i][k] = (k==="on"||k==="inc") ? v : num(v);
  if(k==="inc"&&v){ITEMS[i].hp=0;ITEMS[i].hi=0}
  if(k==="on"&&!ITEMS[i].par){
    var pid=ITEMS[i].id;
    ITEMS.forEach(function(x){if(x.par===pid)x.on=v});
  }
  render();
}
function setT(kel,i,k,v){TERMIN[kel][i][k] = (k==="p"?num(v):v); render()}
function addT(kel){TERMIN[kel].push({p:0,s:SYARAT[kel][0]}); render()}
function delT(kel,i){if(TERMIN[kel].length>1)TERMIN[kel].splice(i,1); render()}
function setDesain(k,v){PILIH_DESAIN[k]=v; render()}
function upd(k,v){S[k]=v; render()}
function setMode(m){
  mode=m;
  document.getElementById("tabSPH").setAttribute("aria-selected",m==="SPH");
  document.getElementById("tabSPK").setAttribute("aria-selected",m==="SPK");
  render();
}
function isiCepat(){
  var v=window.prompt("Nilai kontrak pengadaan + pemasangan (Rp):","425000000");
  if(v===null) return;
  var t=num(String(v).replace(/\D/g,"")), p=Math.round(t*0.87);
  ITEMS.forEach(function(i){
    if(i.id==="P1"){i.hp=p;i.hi=0;i.inc=false;i.on=true}
    if(i.id==="I1"){i.hp=0;i.hi=t-p;i.inc=false;i.on=true}
  });
  render();
}

function ttdBlok(nama,jabatan,pakaiCap){

  var sig=img?'<img class="ttd" src="'+img+'" alt="">':'';
  return '<div class="sigbox">'+(isTrue(S.tampilTtd)?cap+sig:'')+'</div>'+
    '<div class="sig-nm">'+esc(nama)+'</div><div>'+esc(jabatan)+'</div>';

    ["Floor Name",S.namaLantai],["Base Floor",S.baseFloor],["Rate of Traction Machine",S.dayaMesin],
    ["Traction Ratio",S.traksi],["Power Supply",S.power,1],["Lighting Power","220V 50HZ"],["Shaft Size",S.shaftSize,1],
    ["Floor height","After Survey",1],["Overhead","After Survey",1],["Travelling Height","(Custom)",1],
    ["Pit Depth",S.pitDepth,1],["Door opening Type",S.pintu,1],["Door opening Size",S.bukaanPintu,1],
    ["Cabin Size",S.cabinSize,1],["Height of Cabin",S.tinggiKabin,1],
    ["Cabin decoration",namaDesain("cabin")||"As in pic"],["Handrail","Yes"],["Floor",namaDesain("floor")||"—"],
    ["Ceiling",namaDesain("ceiling")||"As at Pict"],["Door",namaDesain("door")||"As at Pict"],
    ["COP",namaDesain("cop")||"As at Pict"],["LOP",namaDesain("lop")||"As at Pict"],
    ["Struktur",namaDesain("struktur")||"—"],["Language","English"],["Brand","BELIFT"]];

    return '<tr><td>'+String(i+1).padStart(3,"0")+'</td><td>'+esc(r[0])+'</td><td'+(r[2]?' class="hl"':'')+'>'+

}

      '<strong>Free Maintenance '+S.freeMtn+', Garansi Spare Part '+S.garSpare+', Garansi Mesin '+S.garMesin+'</strong>.</p>'+
      (adaSipil?'<h4>3. Pekerjaan Sipil</h4><p>Pekerjaan sipil dikerjakan oleh PT Belift Amanah Indonesia berdasarkan '+

      '<p><strong>*</strong> Semua Harga <strong>'+(S.ppn==="exclude"?"Exclude":"Include")+'</strong> PPN 11%</p>'+

  '<div class="page cont"><p style="font-weight:700;text-decoration:underline;margin-bottom:5mm">Syarat dan Kondisi Penawaran :</p>'+

    '<li><strong>Masa pemeliharaan cuma-cuma berlaku selama '+S.freeMtn+' sejak Serah Terima Pekerjaan.</strong></li>'+
    '<li><strong>Garansi peralatan dan pemasangan berlaku '+S.garSpare+' sejak Serah Terima Pekerjaan</strong> '+

function pageSPK(){
  var d=D(), hari=M.hariID[d.getDay()];
  function cap(s){return s.replace(/\b\w/g,function(c){return c.toUpperCase()})}
  function P(n,t,b){
    return '<div class="page cont"><p style="text-align:center;font-weight:700;text-decoration:underline;margin-bottom:1mm">PASAL '+n+
      '</p><p style="text-align:center;font-weight:700;margin-bottom:5mm">'+t+'</p>'+b+
      '<div class="pgnum">'+(n+1)+'</div><div class="paraf">_______ Paraf _______</div></div>';
  }
  var adaSipil=totalKel("SIPIL")>0;
  return ''+
  '<div class="page">'+kop("CONTRACT")+'<div class="docno">'+noSurat()+'</div>'+
    '<p>Pada hari ini, <strong>'+hari+'</strong> tanggal <strong>'+cap(terbilang(d.getDate()))+'</strong> bulan '+
    '<strong>'+M.bulanID[d.getMonth()+1]+'</strong> tahun <strong>'+cap(terbilang(d.getFullYear()))+
    '</strong>, kami yang bertanda tangan dibawah ini:</p>'+
    '<table style="margin:4mm 0 4mm 10mm"><tr><td style="width:24mm;vertical-align:top">Nama</td><td>: <strong>'+
      esc(S.namaCustomer||"…")+'</strong></td></tr><tr><td style="vertical-align:top">NIK</td><td>: '+
      esc(S.nikCustomer||"…")+'</td></tr><tr><td style="vertical-align:top">Alamat</td><td>: '+
      esc(S.alamatCustomer||"…")+'</td></tr></table>'+
    '<p>Dalam hal ini bertindak untuk dan atas nama <strong>'+esc(S.namaPerusahaan||S.namaCustomer||"…")+
      '</strong> untuk selanjutnya disebut <strong>PIHAK PERTAMA</strong></p>'+
    '<table style="margin:4mm 0 4mm 10mm"><tr><td style="width:24mm;vertical-align:top">Nama</td><td>: <strong>'+
      esc(S.direktur)+'</strong></td></tr><tr><td style="vertical-align:top">Jabatan</td><td>: Direktur PT Belift '+
      'Amanah Indonesia</td></tr><tr><td style="vertical-align:top">Alamat</td><td>: '+esc(S.alamatKantor)+'</td></tr></table>'+
    '<p>Dalam hal ini bertindak untuk dan atas nama <strong>PT. Belift Amanah Indonesia</strong> untuk selanjutnya '+
      'disebut sebagai <strong>PIHAK KEDUA</strong></p>'+
    '<p>Selanjutnya kedua belah pihak mengadakan Surat Perjanjian Kerja sebagai berikut:</p>'+
    '<div class="pgnum">1</div><div class="paraf">_______ Paraf _______</div></div>'+

  P(1,"DEFINISI ISTILAH DAN KETENTUAN",
    '<p><strong>1. SPK</strong> — dokumen resmi dasar pelaksanaan pekerjaan yang memuat ruang lingkup, nilai kontrak, '+
    'waktu pelaksanaan, serta syarat dan ketentuan pekerjaan.</p>'+
    '<p><strong>2. MOS (Material On Site)</strong> — material telah tiba dan tersimpan di lokasi proyek namun belum '+
    'dipasang, dapat dijadikan dasar penagihan termin. Risiko kehilangan atau kerusakan sebelum instalasi menjadi '+
    'tanggung jawab Pelaksana Pekerjaan.</p>'+
    '<p><strong>3. BAST</strong> — dokumen resmi yang menyatakan pekerjaan telah selesai dan diserahkan kepada '+
    'Pemberi Kerja; menjadi dasar dimulainya masa garansi.</p>'+
    '<p><strong>4. Commissioning</strong> — pengujian dan verifikasi fungsi, keselamatan, dan performa unit sebelum '+
    'dinyatakan siap digunakan.</p>'+
    '<p><strong>5. Handover</strong> — penyerahan unit setelah commissioning berhasil, dibuktikan dokumen BAST.</p>'+
    '<p><strong>6. Masa Garansi</strong> — Free Maintenance '+S.freeMtn+' · Garansi Spare Part '+S.garSpare+
    ' · Garansi Mesin/Motor '+S.garMesin+', dihitung sejak tanggal BAST.</p>'+
    '<p><strong>7. Progress Pekerjaan</strong> — tingkat penyelesaian berdasarkan tahapan yang telah dilaksanakan, '+
    'menjadi dasar penagihan termin dan harus dapat diverifikasi kedua belah pihak.</p>')+

  P(2,"LINGKUP PEKERJAAN",
    '<p>PIHAK PERTAMA memberi tugas kepada PIHAK KEDUA untuk mengerjakan pekerjaan dengan rincian sebagai berikut:</p>'+
    tabelHargaDoc()+
    '<p style="font-size:9.5pt">Baris bertanda <em>Include</em> merupakan bagian dari lingkup pekerjaan yang harganya '+
    'sudah tercakup pada item induknya.</p>'+
    (adaSipil?'':'<p><strong>Di luar lingkup PIHAK KEDUA</strong> dan menjadi tanggung jawab PIHAK PERTAMA: pekerjaan '+
    'sipil dan arsitektural di luar area pintu lift, sirkulasi udara ruang mesin, pengadaan daya listrik dan instalasi '+
    'sub panel di dekat control panel lift, grounding khusus lift yang terpisah dari penangkal petir, pengadaan gudang '+
    'peralatan lift di lokasi, serta pembuatan pit.</p>'))+

  P(3,"LOKASI PEKERJAAN",'<p>Lokasi pekerjaan berada di '+esc(S.alamatCustomer||"…")+
    ' yang disebut lokasi proyek yang akan dikerjakan oleh PIHAK KEDUA.</p>')+

  P(4,"NILAI KONTRAK",
    '<p>Nilai pekerjaan yang telah disepakati oleh kedua belah pihak adalah <strong>'+rupiah(grandTotal())+
    '</strong>,- ('+terbilangRp(grandTotal())+') dengan rincian:</p><ul class="ul">'+
    kelAktif().filter(function(k){return totalKel(k)>0}).map(function(k){
      return '<li>'+KEL_LABEL[k]+' sebesar <strong>'+rupiah(totalKel(k))+'</strong></li>'}).join("")+
    '</ul><p style="font-size:9.5pt">Harga '+(S.ppn==="exclude"?"belum":"sudah")+' termasuk PPN 11%.</p>')+

  P(5,"WAKTU PELAKSANAAN PEKERJAAN",'<ul class="ul">'+
    '<li>Maksimal <strong>'+esc(S.waktuPengadaan)+'</strong> sejak kontrak ditandatangani dan pembayaran pertama (DP) '+
    'diterima, untuk Material On Site.</li>'+
    '<li>Maksimal <strong>'+esc(S.waktuInstalasi)+'</strong> sejak Material On Site dengan catatan tidak ada kendala '+
    'bangunan dari PIHAK PERTAMA.</li>'+
    (adaSipil?'<li>Pekerjaan sipil diselesaikan sebelum Material On Site, sesuai jadwal yang disepakati kedua belah pihak.</li>':'')+
    '</ul>')+

  P(6,"PINALTY",'<p>Penalty dikenakan apabila keterlambatan terjadi karena kelalaian <strong>PIHAK KEDUA</strong>.</p>'+
    '<ol class="ol"><li>Keterlambatan produksi dan pengiriman material melebihi 2,5 bulan sejak DP diterima dikenakan '+
    'penalty <strong>0,05% per hari kerja (maksimal 1%)</strong> dari nilai pekerjaan pengadaan material unit elevator.</li>'+
    '<li>Keterlambatan pemasangan lebih dari 30 hari sejak material dinyatakan lengkap dan lokasi dinyatakan siap '+
    'dikenakan penalty <strong>0,05% per hari kerja (maksimal 2%)</strong> dari nilai pekerjaan pemasangan.</li>'+
    '<li>Penalty tidak berlaku apabila keterlambatan disebabkan gangguan pekerjaan sipil, keterlambatan pelunasan '+
    'termin, akses kerja yang belum lengkap, dan gangguan listrik di lokasi proyek.</li></ol>')+

  P(7,"CARA PEMBAYARAN",
    '<p>Pembayaran dilakukan terpisah untuk setiap lingkup pekerjaan sebagai berikut:</p>'+terminDoc()+
    '<p>Pembayaran dapat ditransfer <strong>ke rekening</strong></p>'+
    '<p style="margin-left:8mm"><strong>PT. BELIFT AMANAH INDONESIA</strong><br><strong>'+esc(S.rekening)+'</strong></p>')+

  P(8,"FORCE MAJEURE",
    '<p>Force Majeure adalah keadaan di luar kemampuan para pihak yang menyebabkan pekerjaan tidak dapat dilaksanakan, '+
    'seperti bencana alam, gempa bumi, kebakaran, kerusuhan, kebijakan pemerintah, gangguan distribusi material global, '+
    'atau meninggal dunia salah satu pihak.</p>'+
    '<p>Pihak yang mengalami Force Majeure wajib memberitahukan secara tertulis paling lambat <strong>7 (tujuh) hari '+
    'kalender</strong>. Selama Force Majeure berlangsung, kewajiban para pihak ditangguhkan sementara, waktu '+
    'pelaksanaan diperpanjang, dan PIHAK KEDUA tidak dikenakan penalty keterlambatan.</p>'+
    '<p>Dalam hal salah satu pihak meninggal dunia, hak dan kewajiban beralih kepada ahli waris yang sah. Apabila '+
    'Force Majeure berlangsung lebih dari 90 hari kalender dan pekerjaan tidak dapat dilanjutkan, para pihak sepakat '+
    'menyelesaikannya secara musyawarah.</p>')+

  P(9,"PENYELESAIAN",'<p>Apabila terjadi sengketa, <strong>PIHAK PERTAMA</strong> dan <strong>PIHAK KEDUA</strong> '+
    'sepakat menyelesaikan secara musyawarah. Apabila tidak tercapai kesepakatan, diselesaikan melalui Pengadilan '+
    'Negeri sesuai domisili hukum <strong>PIHAK KEDUA</strong>.</p>')+

  P(10,"PENUTUP",
    '<p>Hal-hal yang belum tercantum dalam Surat Perjanjian Kerja ini apabila diperlukan akan dibicarakan kemudian '+
    'dan dituangkan dalam bentuk tertulis serta menjadi addendum yang tak terpisahkan dari perjanjian ini.</p>'+
    '<p>Demikian, Surat Perjanjian Kerja ini ditandatangani oleh kedua belah pihak untuk dapat dilaksanakan dengan '+
    'baik sebagaimana mestinya. Perjanjian ini dibuat dalam rangkap dua, masing-masing dibubuhi materai secukupnya '+
    'serta mempunyai kekuatan hukum yang sama.</p>'+
    '<div class="sign"><div>PIHAK PERTAMA<div class="sigbox"></div><div class="sig-nm">'+esc(S.namaCustomer||"…")+
    '</div>Pemilik Bangunan</div><div>PIHAK KEDUA<br><strong>PT BELIFT AMANAH INDONESIA</strong>'+
    ttdBlok(S.direktur,"Direktur",true)+'</div></div>')+

  desainDoc()+

  '<div class="page cont"><table class="doc spec"><tr><th class="head" colspan="3">Elevator '+esc(S.tipeKabin)+
    ' With Traction Description</th></tr>'+specRows()+'</table>'+
    '<p style="font-weight:700;margin-top:4mm">NOTES: Spesifikasi FINAL SETELAH SURVEY FINAL</p>'+
    '<div class="pgnum">·</div><div class="paraf">_______ Paraf _______</div></div>';
}

function renderPreview(){
  document.getElementById("preview").innerHTML =
    '<div class="plabel">Pratinjau '+mode+' — A4</div>' + (mode==="SPH"?pageSPH():pageSPK());
}
function render(){renderForm();renderPreview()}

function copyRegister(){
  var d=D(), tgl=d.getDate()+"-"+M.bulanID[d.getMonth()+1]+"-"+String(d.getFullYear()).slice(2);
  var row = (mode==="SPH")
    ? [pad3(S.noUrut),tgl,noSurat(),S.namaPerusahaan||S.namaCustomer,S.jenisLift,"Hold"].join("\t")
    : [pad3(S.noUrut),tgl,noSurat(),grandTotal(),S.namaPerusahaan||S.namaCustomer,namaFile(),
       totalKel("PENGADAAN"),totalKel("INSTALASI"),"","Approved","START PROJECT","",totalKel("SIPIL"),
       grandTotal(),""].join("\t");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(row).then(function(){
      var b=document.getElementById("btnReg"), t=b.textContent;
      b.textContent="Tersalin — tempel di register";
      setTimeout(function(){b.textContent=t},2200);
    },function(){window.prompt("Salin baris ini lalu tempel ke register:",row)});
  } else { window.prompt("Salin baris ini lalu tempel ke register:",row); }
}

render();
